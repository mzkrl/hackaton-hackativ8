name: gene-pilot

# 1. Deklarasi Network di tingkat file Compose
networks:
  # Network internal: Hanya untuk komunikasi antar database, backend, minio, dll.
  internal_net:
    driver: bridge

  # Network eksternal: Digunakan bersama dengan Nginx Proxy Manager (NPM)
  web_net:
    external: true

services:

  # ==========================
  # Langflow
  # ==========================

  langflow:
    image: langflowai/langflow:latest
    environment:
      LANGFLOW_DATABASE_URL: ${LANGFLOW_DATABASE_URL}
      LANGFLOW_CONFIG_DIR: ${LANGFLOW_CONFIG_DIR}
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_NEW_USER_IS_ACTIVE: ${LANGFLOW_NEW_USER_IS_ACTIVE}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN}
    ports:
      - "8080:7860"
    depends_on:
      - langflow-postgres
    networks:
      - internal_net
      - web_net      

  langflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${LANGFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LANGFLOW_POSTGRES_DB}
    volumes:
      - langflow-postgres-data:/var/lib/postgresql/data
    networks:
      - internal_net

  # ==========================
  # Bioinformatics Services
  # ==========================

  sequence-analysis:
    image: j0pyter/sequence-analysis-service:1.0.0
    restart: unless-stopped
    ports:
      - "8001:8000"
    networks:
      - internal_net


  # ==========================
  # Backend Infrastructure
  # ==========================

  backend-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    networks:
      internal_net:
      web_net:
        aliases:
          - gene-pilot-backend-db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps queued jobs across restarts; maxmemory-policy
    # noeviction is required so BullMQ never silently drops a queued job.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./cert/minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  # One-shot: create the bucket and keep it private. Without this the bucket
  # does not exist and /storage/health reports STORAGE_UNAVAILABLE.
    networks:
      - internal_net

volumes:
  backend-postgres-data:
  minio-data:
  redis-data:
  langflow-postgres-data: